# Packings submitted through the "Submit a packing" issue form (label: submission).
#  * opened / edited: float check + exact certificate (scripts/check_submission.py check), reply on the issue, labels
#    certified / not-certified / new-record / needs-fix.
#  * labeled "accepted" (maintainers only): the same check, then the record file is written with the submitter's
#    credit, committed to main, the site is rebuilt and deployed to gh-pages, and the issue is closed.
# Issue text is only read from the event file by the Python script; it never reaches a shell command.
name: submission
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  # Acceptances share a lock with the normal site publisher; two reviewed records cannot race during comparison/push.
  group: ${{ github.event.action == 'labeled' && 'packing-record-publication' || format('submission-{0}', github.event.issue.number) }}
  queue: max
  cancel-in-progress: false
jobs:
  check:
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') && github.event.issue.state == 'open' &&
      (github.event.action == 'opened' || github.event.action == 'edited' ||
       (github.event.action == 'labeled' && github.event.label.name == 'accepted'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
      MODE: ${{ github.event.action == 'labeled' && 'accept' || 'check' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy scipy
      - name: Authorize maintainer acceptance
        if: env.MODE == 'accept'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')
          case "$permission" in
            admin|maintain|write) echo "SUBMISSION_CAN_ACCEPT=1" >> "$GITHUB_ENV" ;;
            *) echo "Acceptance requires a maintainer with write, maintain or admin access." >&2; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUM" > "$RUNNER_TEMP/current-issue.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as f: event = json.load(f)
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'current-issue.json')) as f: current = json.load(f)
          labels = {label['name'] for label in current['labels']}
          if (current['state'] != 'open' or not {'submission', 'accepted'} <= labels
                  or current.get('body') != event['issue'].get('body')):
              raise SystemExit('The issue or acceptance changed. Review it again and reapply the accepted label.')
          PY
      - name: Labels
        run: |
          gh label create submission    --color 2c49a8 --description "Packing submitted for certification" --force
          gh label create certified     --color 2f6b45 --description "Exact certificate passed" --force
          gh label create not-certified --color a33b2b --description "Exact certificate failed" --force
          gh label create new-record    --color 9a4f17 --description "Certified and better than (or filling) the record" --force
          gh label create needs-fix     --color d9822b --description "The submission could not be read" --force
          gh label create accepted      --color 3f9a6a --description "Maintainer: write this packing to the records" --force
          gh label create category      --color 7a5fc4 --description "Proposal for a new category" --force
          gh label create construction  --color 2a9fb0 --description "Another polyhedra-in-polyhedra construction" --force
      - name: Check the packing
        run: python3 scripts/check_submission.py "$MODE" "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/out"
      - name: Save every candidate result and trusted checker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-results-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
      - name: Confirm the reviewed packing is still current
        if: env.MODE == 'accept'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUM" > "$RUNNER_TEMP/current-issue.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as f: event = json.load(f)
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'current-issue.json')) as f: current = json.load(f)
          labels = {label['name'] for label in current['labels']}
          if (current['state'] != 'open' or not {'submission', 'accepted'} <= labels
                  or current.get('body') != event['issue'].get('body')):
              raise SystemExit('The packing changed during certification. Review it again and reapply the accepted label.')
          PY
      - name: Read acceptance result
        run: |
          echo "ACCEPTED=$(python3 -c "import json,sys; print('1' if json.load(open(sys.argv[1]))['accepted'] else '')" "$RUNNER_TEMP/out/result.json")" >> "$GITHUB_ENV"
          echo "COMPLETE=$(python3 -c "import json,sys; print('1' if json.load(open(sys.argv[1]))['complete'] else '')" "$RUNNER_TEMP/out/result.json")" >> "$GITHUB_ENV"
      - name: Commit the record
        if: env.ACCEPTED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records docs/community_records.json
          git commit -q -m "Record from submission #$NUM"
          pushed=0
          for i in 1 2 3; do
            git fetch -q origin main
            python3 - <<'PY'
          import json, os, subprocess
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'out/result.json')) as stream:
              result = json.load(stream)
          def blob(revision, path):
              check = subprocess.run(['git', 'rev-parse', '--verify', f'{revision}:{path}'], capture_output=True, text=True)
              return check.stdout.strip() if check.returncode == 0 else None
          for path in result['guard_paths']:
              if blob('HEAD^', path) != blob('origin/main', path):
                  raise SystemExit(f'The certified baseline or solid definition changed ({path}); review the batch again.')
          PY
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "The record could not be pushed; the issue remains open." >&2; exit 1; }
      - name: Rebuild and deploy the site
        if: env.ACCEPTED == '1'
        run: |
          python3 scripts/site.py
          git fetch -q origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -q -f "$RUNNER_TEMP/pages" origin/gh-pages
          cd "$RUNNER_TEMP/pages"
          git checkout -q -B gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/site/." .
          git add -A
          if git diff --cached --quiet; then
            echo "The deployed site is already current."
          else
            git commit -q -m "Site: record from submission #$NUM"
            git push -q origin gh-pages
          fi
      - name: Reply
        run: |
          gh issue comment "$NUM" --body-file "$RUNNER_TEMP/out/comment.md"
          add=$(python3 -c "import json,sys; print(','.join(json.load(open(sys.argv[1]))['labels_add']))" "$RUNNER_TEMP/out/result.json")
          rem=$(python3 -c "import json,sys; print(','.join(json.load(open(sys.argv[1]))['labels_remove']))" "$RUNNER_TEMP/out/result.json")
          [ -n "$add" ] && gh issue edit "$NUM" --add-label "$add" || true
          [ -n "$rem" ] && gh issue edit "$NUM" --remove-label "$rem" || true
      - name: Close
        if: env.ACCEPTED == '1' && env.COMPLETE == '1'
        run: gh issue close "$NUM" --reason completed
