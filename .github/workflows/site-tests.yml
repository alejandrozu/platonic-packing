name: Website and contribution tests
on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/site.py'
      - 'scripts/engine.py'
      - 'scripts/check_submission.py'
      - 'scripts/import_external_records.py'
      - 'docs/external_records.json'
      - 'records/external/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'
      - '.github/workflows/submission.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/site.py'
      - 'scripts/engine.py'
      - 'scripts/check_submission.py'
      - 'scripts/import_external_records.py'
      - 'docs/external_records.json'
      - 'records/external/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'
      - '.github/workflows/submission.yml'
      - '.github/ISSUE_TEMPLATE/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet numpy scipy
      - run: node --check web/assets/theme.js && node --check web/assets/explorer.js && node --check web/assets/contribute.js
      - run: node tests/test_submission_forms.mjs
      - run: node tests/test_explorer_selection.mjs
      - run: python -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -X utf8 scripts/site.py
