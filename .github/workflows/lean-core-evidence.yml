name: Lean complete core evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs/research-2026-10-16-generalization/formal
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/research-2026-10-16-generalization/formal
          fetch-depth: 1
      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/packing-elan-init.sh
          sh /tmp/packing-elan-init.sh -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Restore pinned mathlib
        run: |
          lake exe cache get
          git diff --exit-code -- lake-manifest.json
          python3 - <<'PYDEPS'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('lake-manifest.json').read_text())
          for item in manifest['packages']:
              if item['type'] != 'git':
                  raise SystemExit('Only pinned git dependencies are allowed')
              directory = Path(manifest['packagesDir']) / item['name']
              actual = subprocess.check_output(['git', '-C', str(directory), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != item['rev']:
                  raise SystemExit('Dependency revision differs from frozen manifest: ' + item['name'])
          print('All dependency checkouts match the frozen manifest')
          PYDEPS
      - name: Verify all core stages and negative cases
        run: python3 verify_core.py --mathlib-project .
      - name: Build dimension-independent continuation prerequisite
        run: >-
          python3 verify_extensions.py --mathlib-project .
          --modules PackingCertificates/Extensions/GenericDimension.lean
          --output analytic-continuation-prerequisite-verification.json
      - name: Verify quantitative clearance and exact support identities
        run: >-
          python3 verify_extensions.py --mathlib-project .
          --modules PackingCertificates/Extensions/Clearance.lean PackingCertificates/Extensions/SupportIdentity.lean
          --output extension-clearance-support-verification.json
      - name: Verify materials-model configuration volume and periodic motifs
        run: >-
          python3 verify_extensions.py --mathlib-project .
          --modules PackingCertificates/Extensions/FreeVolume.lean PackingCertificates/Extensions/PeriodicMotif.lean
          --output extension-materials-verification.json
      - name: Archive complete source, object and log closure
        run: python3 catalogue/package_core_evidence.py
      - name: Retain complete core evidence
        uses: actions/upload-artifact@v4
        with:
          name: lean-complete-core-evidence
          path: docs/research-2026-10-16-generalization/formal/catalogue/ci-core/evidence.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Retain analytic theorem sources objects receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-clearance-support-evidence
          path: |
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Core.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Core.olean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/GenericDimension.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/GenericDimension.olean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/Clearance.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/Clearance.olean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/SupportIdentity.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/SupportIdentity.olean
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Core.lean.log
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Extensions_GenericDimension.lean.log
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Extensions_Clearance.lean.log
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Extensions_SupportIdentity.lean.log
            docs/research-2026-10-16-generalization/formal/extension-clearance-support-verification.json
            docs/research-2026-10-16-generalization/formal/analytic-continuation-prerequisite-verification.json
            docs/research-2026-10-16-generalization/formal/verify_core.py
            docs/research-2026-10-16-generalization/formal/verify_extensions.py
            docs/research-2026-10-16-generalization/formal/lean-toolchain
            docs/research-2026-10-16-generalization/formal/lake-manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Retain materials-model sources objects receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-materials-model-evidence
          path: |
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Core.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Core.olean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/Clearance.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/Clearance.olean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/FreeVolume.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/FreeVolume.olean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/PeriodicMotif.lean
            docs/research-2026-10-16-generalization/formal/PackingCertificates/Extensions/PeriodicMotif.olean
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Core.lean.log
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Extensions_Clearance.lean.log
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Extensions_FreeVolume.lean.log
            docs/research-2026-10-16-generalization/formal/core-build-logs/PackingCertificates_Extensions_PeriodicMotif.lean.log
            docs/research-2026-10-16-generalization/formal/extension-materials-verification.json
            docs/research-2026-10-16-generalization/formal/verify_core.py
            docs/research-2026-10-16-generalization/formal/verify_extensions.py
            docs/research-2026-10-16-generalization/formal/lean-toolchain
            docs/research-2026-10-16-generalization/formal/lake-manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
