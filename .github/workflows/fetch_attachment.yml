# Downloads the files attached to an issue's body (github.com/user-attachments/files/...) into a build artifact,
# so that a maintainer can read a submitted table or archive. Nothing in the files is run.
name: fetch-attachments
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
permissions:
  contents: read
  issues: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the attachments
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "issue must be a number"; exit 1; }
          mkdir -p out
          gh api "repos/$REPO/issues/$ISSUE" --jq .body \
            | grep -oE 'https://github\.com/user-attachments/files/[0-9]+/[A-Za-z0-9._-]+' | sort -u > urls.txt
          cat urls.txt
          [ -s urls.txt ] || { echo "no attachments"; exit 1; }
          while read -r u; do curl -fsSL --max-filesize 100000000 -o "out/$(basename "$u")" "$u"; done < urls.txt
          ls -la out && sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: issue-${{ inputs.issue }}-attachments
          path: out/
          retention-days: 14
