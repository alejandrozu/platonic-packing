name: Submit a packing
description: One 3D polyhedral packing or a batch of native witnesses, for exact certification and record comparison.
title: "[packing] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting! Check your packing first on https://polyhedrainpolyhedra.wiki/contribute/ (it can fill in this form for you).
        After you open the issue, a GitHub Action runs the float check and the exact certifier on it and comments with the result.
  - type: input
    id: problem
    attributes:
      label: Problem
      description: Problem id (for example `ktoinkto`), or "piece in container" using names from src/solids.json.
      placeholder: ktoinkto
    validations:
      required: true
  - type: input
    id: n
    attributes:
      label: Number of pieces
      description: For one packing. For a batch, each JSON record must supply its own n.
      placeholder: "20"
    validations:
      required: false
  - type: input
    id: s
    attributes:
      label: Container scale s
      description: For one packing. A batch supplies s_full separately in every JSON record.
    validations:
      required: false
  - type: textarea
    id: packing
    attributes:
      label: Packing
      description: |
        JSON with "piece", "container", "n", "s_full" and "pieces" (one [x, y, z, qw, qx, qy, qz] per piece; see the format on the contribute page).
        The checker supports 1–200 pieces. Pieces must not touch: leave a small positive clearance (about 1e-7) between pieces and from the walls.
        A batch may be a JSON array of full records, or {"records": [...]}. Each entry needs its own piece, container, n, s_full and pieces.
        Only 3D convex-polyhedron-in-convex-polyhedron packings are supported. 2D square/circle packings are outside this project.
      render: json
    validations:
      required: false
  - type: textarea
    id: batch_archives
    attributes:
      label: Batch archives
      description: |
        Optional GitHub user-attachment ZIP links. Supply native JSON witnesses in records/ or witnesses/.
        A top-level MANIFEST.json with cases [{"file": "records/example.json", "sha256": "..."}] selects the active records;
        witness/witness_sha256 are also supported. Source/history files and scripts are ignored. Submitted scripts are never run.
        Maximum 2,000 candidates, eight ZIPs, 64 MiB per compressed ZIP and 256 MiB expanded per ZIP.
        Original found_by/credit may be provided per record. A wall-padding refinement should retain those and name certificate_refined_by separately.
  - type: input
    id: credit
    attributes:
      label: Credit
      description: How the record should credit you (name, handle or team).
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: How you found it
      description: Method, software, or a link to a write-up. Optional.
  - type: checkboxes
    id: terms
    attributes:
      label: Permission
      options:
        - label: This packing is my own work (or I credit its source above), and it may be published in the repository under its MIT license.
          required: true
