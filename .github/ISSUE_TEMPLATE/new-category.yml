name: Propose a new category
description: Propose a new 3D convex-polyhedron-in-convex-polyhedron problem or solid.
title: "[category] "
labels: ["category"]
body:
  - type: input
    id: pieces
    attributes:
      label: Pieces
      description: 3D convex polyhedra only; 2D packings and curved solids are outside this archive.
      placeholder: e.g. regular dodecahedra, or a convex polyhedron not in the library
    validations:
      required: true
  - type: input
    id: container
    attributes:
      label: Container
      placeholder: e.g. a cube or a truncated octahedron
    validations:
      required: true
  - type: input
    id: measure
    attributes:
      label: What to minimize
      placeholder: e.g. container edge ÷ piece edge, for n = 2–40
  - type: textarea
    id: motivation
    attributes:
      label: Why it is interesting
  - type: textarea
    id: details
    attributes:
      label: Definitions, coordinates or known results
      description: Vertex coordinates, references, links. Packings you already have can go here too.
