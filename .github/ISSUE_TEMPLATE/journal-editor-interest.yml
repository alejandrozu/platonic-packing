name: Journal editorial interest
description: Express interest in joining the Journal as an editor.
title: "[Journal editorial interest] "
body:
  - type: markdown
    attributes:
      value: |
        The Journal welcomes additional editors with relevant research experience in polyhedral packing, higher-dimensional polytopes, exact verification or related materials research.
        This is a public expression of interest, not an appointment. Please omit private contact details and confidential information.
  - type: input
    id: name
    attributes:
      label: Name
      description: The public name you use for your research.
    validations:
      required: true
  - type: textarea
    id: expertise
    attributes:
      label: Relevant expertise
      description: Describe the subjects and types of manuscripts you could assess or handle.
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Public research links
      description: Link publications, an ORCID profile, relevant constructions or other public evidence of your experience.
    validations:
      required: true
  - type: textarea
    id: availability
    attributes:
      label: Availability and relevant conflicts
      description: Briefly describe your availability and any interests or collaborations relevant to editorial independence. Do not disclose private information.
