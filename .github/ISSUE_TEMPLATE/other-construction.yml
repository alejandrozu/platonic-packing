name: Share another construction
description: Any packing of polyhedra inside a polyhedron that does not fit a tracked category, a proof, a lattice construction, a lower bound.
title: "[construction] "
labels: ["construction"]
body:
  - type: input
    id: summary
    attributes:
      label: Title
      placeholder: e.g. 27 truncated octahedra in a truncated octahedron by a lattice
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data
      description: Coordinates (JSON or text), or where to find them.
  - type: input
    id: links
    attributes:
      label: Links and references
